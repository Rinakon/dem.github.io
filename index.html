<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КОЛЯДКА</title>

    <!-- Подключаем шрифт Pudelinka -->
    <style>
        @font-face {
            font-family: 'Pudelinka';
            src: url('fonts/Pudelinka.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Pudelinka', cursive, sans-serif;
            background: #0d3b66; /* Простой однотонный фон */
            color: #f4f1de;
            text-align: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .content {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(13, 59, 102, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 209, 102, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1;
            position: relative;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ffd166, 0 0 30px #ffd166;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .date {
            font-size: 1.2em;
            color: #a7c5eb;
            margin-bottom: 20px;
            font-style: italic;
        }

        .kolyadka {
            font-size: 1.8em;
            line-height: 1.5;
            margin: 30px 0;
            padding: 20px;
            background: rgba(244, 241, 222, 0.1);
            border-radius: 15px;
            border: 2px solid #ffd166;
            text-shadow: 0 0 8px #ffd166;
        }

        .snow {
            font-size: 1.2em;
            color: #a7c5eb;
            margin-top: 20px;
            animation: snowfall 3s linear infinite;
        }

        .links {
            margin-top: 40px;
            font-size: 1.2em;
        }

        .links a {
            color: #ffd166;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            display: inline-block;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .links a:hover {
            background: #ffd166;
            color: #0d3b66;
            transform: scale(1.05);
        }

        @keyframes glow {
            from { text-shadow: 0 0 15px #ffd166; }
            to { text-shadow: 0 0 30px #ffd166, 0 0 50px #ffd166; }
        }

        @keyframes snowfall {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            .kolyadka { font-size: 1.4em; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>КОЛЯДКА 🎄</h1>
        <div class="date">Сегодня: 20 декабря 2025 года</div>

        <div class="kolyadka">
            Пудель-пудель, лапы вверх —<br>
            Звёзды светят, как умех!<br>
            Дед Мороз в дверь постучал,<br>
            И подарки нам прислал! 🐶🎁
        </div>

        <div class="snow">✨ С Рождеством! ✨ ❄️</div>

        <div class="links">
            <a href="krossvordRU.html">Русский кроссворд</a><br>
            <a href="krossvordEN.html">Английский кроссворд</a><br>
            <a href="video.html">🎥 Посмотреть рождественское видео</a>
        </div>
    </div>

    <script>
        // Устанавливаем дату (на случай, если вы захотите автоматизировать)
        const now = new Date(2025, 11, 20); // декабрь = 11
        const options = { 
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        };
        document.querySelector('.date').textContent = `Сегодня: ${now.toLocaleDateString('ru-RU', options)}`;
    </script>

</body>
</html>
