<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогоднее видео</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d3b66;
            color: #f4f1de;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 20px;
            color: #ffd166;
            text-shadow: 0 0 10px #ffd166;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 209, 102, 0.5);
        }

        .video-container iframe {
            width: 100%;
            height: 450px; /* фиксированная высота для лучшего отображения */
            display: block;
            border: none;
            border-radius: 15px;
        }

        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: #ffd166;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid #ffd166;
            border-radius: 10px;
            transition: background 0.3s, color 0.3s;
        }

        .back-link:hover {
            background: #ffd166;
            color: #0d3b66;
        }

        @media (max-width: 600px) {
            .video-container iframe {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <h1>🎄 Новогоднее видео 🎄</h1>

    <div class="video-container">
        <iframe
            src="https://rutube.ru/play/embed/7349796536f20502444adf8be7c13c42"
            allowfullscreen
            loading="lazy">
        </iframe>
    </div>

    <a href="index.html" class="back-link">← Вернуться на главную</a>
</body>
</html>
