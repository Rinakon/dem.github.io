<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рождественское видео 🎄</title>

    <!-- Подключаем шрифт Pudelinka -->
    <style>
        @font-face {
            font-family: 'Pudelinka';
            src: url('fonts/Pudelinka.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Pudelinka', cursive, sans-serif;
            background: #0d3b66;
            color: #f4f1de;
            text-align: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ffd166, 0 0 30px #ffd166;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .video-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 209, 102, 0.3);
        }

        .video-frame {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 */
            position: relative;
        }

        .video-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-link {
            margin-top: 30px;
            font-size: 1.2em;
        }

        .back-link a {
            color: #ffd166;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            background: #ffd166;
            color: #0d3b66;
            transform: scale(1.05);
        }

        @keyframes glow {
            from { text-shadow: 0 0 15px #ffd166; }
            to { text-shadow: 0 0 30px #ffd166, 0 0 50px #ffd166; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .video-container { width: 95%; }
        }
    </style>
</head>
<body>

    <h1>🎥 Рождественское видео 🎄</h1>

    <div class="video-container">
        <div class="video-frame">
        
            <iframe 
                src="0d876f78-e38c-4d3f-a986-0bb30a9badb6.mp4" 
                frameborder="0" 
                allowfullscreen 
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
    </div>

    <div class="back-link">
        <a href="index.html">← Вернуться на главную</a>
    </div>

</body>
</html>
